<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chris vs Julius — Street Fight</title><style>
*{box-sizing:border-box}body{margin:0;background:#100f1c;color:#fff;font-family:system-ui,Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{text-align:center;padding:22px 12px 10px}h1{margin:0;font-size:clamp(24px,5vw,46px);letter-spacing:2px;color:#ffdb62;text-shadow:4px 4px #b12d4d}header p{margin:5px;color:#aaa7bb}main{width:min(1100px,96vw)}.frame{position:relative;border:5px solid #3b345b;border-radius:15px;overflow:hidden;box-shadow:0 18px 60px #0009}canvas{display:block;width:100%;height:auto;image-rendering:auto;background:#8ccde0}.hud{position:absolute;top:16px;left:3%;right:3%;display:flex;gap:16px;align-items:flex-start;pointer-events:none}.fighter{flex:1}.fighter.right{text-align:right}.name{font-weight:1000;letter-spacing:2px;text-shadow:2px 2px #171325}.meter{height:23px;border:3px solid #241e36;background:#301d32;border-radius:5px;overflow:hidden}.meter>div{height:100%;width:100%;background:linear-gradient(#f7eb72,#edac3d);transition:width .12s}.right .meter>div{margin-left:auto;background:linear-gradient(#f899a5,#e74e6a)}.timer{background:#211c39;border:3px solid #f8dc78;border-radius:10px;padding:5px 12px;font-weight:1000;font-size:30px;min-width:75px;text-align:center}.overlay{position:absolute;inset:0;background:#100e22b9;display:grid;place-items:center;text-align:center}.overlay.hidden{display:none}.panel{background:#211b3e;border:3px solid #f6d66b;border-radius:20px;padding:24px 35px;box-shadow:0 12px 40px #0008}.panel h2{font-size:clamp(28px,5vw,56px);margin:0 0 8px;color:#ffdc69}.panel p{color:#ddd}button{cursor:pointer;background:#ffcf59;color:#21142e;border:0;border-radius:10px;font-weight:900;padding:13px 24px;font-size:16px}button:hover{background:#fff0a3}.instructions{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:20px 3px;color:#d1cde3}.instructions strong{color:#ffdb62}kbd{display:inline-block;background:#34304e;padding:4px 7px;border-radius:5px;border:1px solid #5b557b;margin:2px}.touch{display:none;gap:10px;justify-content:space-between;margin:5px 0 25px}.touch>div{display:flex;gap:7px;flex-wrap:wrap}.touch button{touch-action:none;min-width:53px;padding:13px}@media(pointer:coarse){.touch{display:flex}}@media(max-width:600px){.hud{top:7px;gap:5px}.name{font-size:11px}.meter{height:14px}.timer{font-size:17px;min-width:42px;padding:2px}.panel{padding:18px}.instructions{font-size:12px}}
</style></head><body><header><h1>CHRIS <span style="color:white">VS</span> JULIUS</h1><p>STREET FIGHT · DEMO 0.3 · BED-STUY</p></header><main><div class="frame"><canvas id="game" width="960" height="540" aria-label="Arena de luta Chris contra Julius"></canvas><div class="hud"><div class="fighter"><div class="name">CHRIS</div><div class="meter"><div id="hp1"></div></div></div><div id="clock" class="timer">60</div><div class="fighter right"><div class="name">JULIUS</div><div class="meter"><div id="hp2"></div></div></div></div><div class="overlay" id="overlay"><div class="panel"><h2 id="result">CHRIS VS JULIUS</h2><p id="message">Brooklyn não é para amadores!</p><button id="start">COMEÇAR LUTA</button></div></div></div><div class="instructions"><div><strong>MOVER</strong> <kbd>A</kbd><kbd>D</kbd> · <strong>PULAR</strong> <kbd>W</kbd></div><div><strong>SOCO</strong> <kbd>J</kbd> · <strong>CHUTE</strong> <kbd>K</kbd> · <strong>MOCHILA</strong> <kbd>L</kbd></div><div><strong>REINICIAR</strong> <kbd>R</kbd></div></div><div class="touch"><div><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">▲</button></div><div><button data-key="j">👊</button><button data-key="k">🦵</button><button data-key="l">🎒</button></div></div></main>
<script>
const canvas=document.getElementById('game'),c=canvas.getContext('2d'),keys=new Set(),floor=432;
const images={};for(const [key,src] of Object.entries({chris:'assets/characters/chris/idle.png',julius:'assets/characters/julius/idle.png',brooklyn:'assets/backgrounds/brooklyn.png'})){const img=new Image();img.src=src;images[key]=img;}c.imageSmoothingEnabled=false;const $=id=>document.getElementById(id);let p,e,playing=false,remaining=60,last=0,aiTimer=0,particles=[],shake=0,hitStop=0;
function fighter(x,isChris){return{x,y:floor,vy:0,hp:100,face:isChris?1:-1,attack:null,attackUntil:0,cooldown:0,stun:0,flash:0,isChris,specialUntil:0,attackStart:0,hitUntil:0,walking:false};}
function reset(){p=fighter(235,true);e=fighter(725,false);remaining=60;aiTimer=0;particles=[];shake=0;hitStop=0;playing=true;$('overlay').classList.add('hidden');last=performance.now();}
function end(text){playing=false;$('result').textContent=text;$('message').textContent=text==='CHRIS VENCEU!'?'Julius vai descontar isso do salário!':text==='JULIUS VENCEU!'?'Dois empregos e uma vitória!':'Ninguém levou o troféu hoje.';$('start').textContent='JOGAR NOVAMENTE';$('overlay').classList.remove('hidden');}
$('start').onclick=reset;
function action(f,type,now){if(!playing||now<f.cooldown||now<f.stun)return;const special=type==='special';f.attack=type;f.attackStart=now;f.attackUntil=now+(special?400:type==='kick'?280:210);f.cooldown=now+(special?1200:type==='kick'?540:340);const other=f===p?e:p;const range=special?125:type==='kick'?92:70;const distance=(other.x-f.x)*f.face;if(distance>0&&distance<range&&Math.abs(other.y-f.y)<75){let damage=special?19:type==='kick'?12:8;if(!f.isChris&&now<f.specialUntil)damage+=5;other.hp=Math.max(0,other.hp-damage);other.x=Math.max(55,Math.min(905,other.x+f.face*19));other.stun=now+230;other.flash=now+180;other.hitUntil=now+260;shake=special?13:type==='kick'?8:5;hitStop=special?.09:.045;for(let i=0;i<9;i++)particles.push({x:other.x,y:other.y-100,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,life:.35});if(other.hp<=0)end(f.isChris?'CHRIS VENCEU!':'JULIUS VENCEU!');}}
function jump(f){if(f.y>=floor-1){f.vy=-680;}}
window.addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if('adwjklr'.includes(k))ev.preventDefault();keys.add(k);if(k==='r')reset();if(k==='w'&&playing)jump(p);if(['j','k','l'].includes(k))action(p,{j:'punch',k:'kick',l:'special'}[k],performance.now());});window.addEventListener('keyup',ev=>keys.delete(ev.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',ev=>{ev.preventDefault();keys.add(k);if(k==='w')jump(p);if('jkl'.includes(k))action(p,{j:'punch',k:'kick',l:'special'}[k],performance.now());});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys.delete(k)));});
function update(dt,now){if(!playing)return;remaining-=dt;if(remaining<=0){remaining=0;end(p.hp>e.hp?'CHRIS VENCEU!':e.hp>p.hp?'JULIUS VENCEU!':'EMPATE!');return;}const speed=265;p.walking=keys.has('a')||keys.has('d');if(now>p.stun){if(keys.has('a'))p.x-=speed*dt;if(keys.has('d'))p.x+=speed*dt;}const dx=p.x-e.x;e.walking=Math.abs(dx)>85;if(now>e.stun){if(Math.abs(dx)>85)e.x+=Math.sign(dx)*145*dt;else if(Math.abs(dx)<52)e.x-=Math.sign(dx)*65*dt;}p.x=Math.max(40,Math.min(920,p.x));e.x=Math.max(40,Math.min(920,e.x));p.face=p.x<e.x?1:-1;e.face=-p.face;for(const f of [p,e]){f.vy+=1600*dt;f.y+=f.vy*dt;if(f.y>floor){f.y=floor;f.vy=0;}if(now>f.attackUntil)f.attack=null;}aiTimer-=dt;if(aiTimer<=0){aiTimer=.45+Math.random()*.5;if(Math.abs(dx)<130){if(Math.random()<.25)e.specialUntil=now+3000;action(e,Math.random()<.35?'kick':'punch',now);}else if(Math.random()<.12)jump(e);}for(const a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;}particles=particles.filter(a=>a.life>0);$('hp1').style.width=p.hp+'%';$('hp2').style.width=e.hp+'%';$('clock').textContent=Math.ceil(remaining);}
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h);}function round(x,y,w,h,r,color){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}
function background(){if(images.brooklyn.complete&&images.brooklyn.naturalWidth){c.drawImage(images.brooklyn,0,0,960,540);return;}const sky=c.createLinearGradient(0,0,0,450);sky.addColorStop(0,'#76b8d4');sky.addColorStop(1,'#f2c49b');rect(0,0,960,540,sky);c.fillStyle='#ffe8a4';c.beginPath();c.arc(775,90,46,0,7);c.fill();for(let i=0;i<9;i++){const x=i*120-30,h=160+(i*67)%125;rect(x,432-h,112,h,i%2?'#aa7180':'#c48b77');rect(x+8,432-h,96,12,'#e2b19a');for(let j=0;j<3;j++)for(let k=0;k<2;k++){rect(x+17+k*47,455-h+j*53,25,33,'#3e5266');rect(x+20+k*47,458-h+j*53,19,24,'#b6d7da');}rect(x+43,390,37,42,'#55465b');}rect(0,432,960,108,'#4c4d5c');rect(0,432,960,10,'#e5bd83');for(let x=0;x<960;x+=155)rect(x+30,500,85,5,'#e9c884');round(370,288,218,47,6,'#263349');c.font='bold 22px system-ui';c.fillStyle='#ffe18b';c.textAlign='center';c.fillText('BED-STUY • BROOKLYN',479,319);}
function drawFighter(f,now){const sprite=images[f.isChris?'chris':'julius'];if(sprite.complete&&sprite.naturalWidth){c.save();const big=!f.isChris;const h=big?270:228,w=h*sprite.naturalWidth/sprite.naturalHeight;const bob=playing&&f.y>=floor&&!f.attack?Math.sin(now/(f.walking?75:210))*(f.walking?5:2):0;c.translate(f.x,f.y+bob);c.scale(f.face*(f.isChris?1:-1),1);if(now<f.flash)c.globalAlpha=.5;
const active=f.attack&&now<f.attackUntil;const duration=f.attack==='special'?400:f.attack==='kick'?280:210;const phase=active?Math.min(1,(now-f.attackStart)/duration):0;const thrust=active?Math.sin(Math.PI*phase):0;
if(now<f.hitUntil){c.translate(-12*thrust+5,0);c.rotate(-.10);}
if(active){c.translate(thrust*(f.attack==='special'?32:19),-thrust*(f.attack==='kick'?13:5));c.rotate(thrust*(f.attack==='kick'?-0.22:0.14));}
c.drawImage(sprite,-w/2,-h,w,h);
if(active){c.save();c.strokeStyle=f.attack==='special'?'#65e8ff':'#fff2a0';c.lineWidth=f.attack==='special'?8:5;c.globalAlpha=.8*thrust;c.beginPath();const reach=f.attack==='special'?115:f.attack==='kick'?98:76;c.arc(reach/2,-h*(f.attack==='kick'?.3:.55),reach/2,-1.2,1.1);c.stroke();c.restore();}
if(now<f.hitUntil){c.save();c.globalAlpha=.35;c.fillStyle='#ff435c';c.fillRect(-w/2,-h,w,h);c.restore();}if(!f.isChris&&now<f.specialUntil){c.strokeStyle='#ffe17d';c.lineWidth=3;c.beginPath();c.ellipse(0,-h/2,w/2+9,h/2+9,0,0,Math.PI*2);c.stroke();}c.restore();return;}c.save();c.translate(f.x,f.y);c.scale(f.face,1);const attacking=f.attack&&now<f.attackUntil;const special=attacking&&f.attack==='special';const kick=attacking&&f.attack==='kick';const punch=attacking&&f.attack==='punch';const big=!f.isChris;const s=big?1.2:1;c.scale(s,s);if(now<f.flash)c.globalAlpha=.55;rect(-25,-6,50,7,'#22243366');c.lineWidth=6;c.strokeStyle='#252136';c.lineCap='round';c.beginPath();c.moveTo(-13,-52);c.lineTo(kick?0:-14,-8);c.moveTo(13,-52);c.lineTo(kick?68:14,kick?-39:-8);c.stroke();round(-23,-12,27,11,4,'#29212d');round(kick?54:1,kick?-43:-12,27,11,4,'#29212d');round(-29,-120,58,72,11,f.isChris?'#f3cb57':'#527d6a');if(big){round(-32,-118,64,35,9,'#547f6b');round(-5,-117,12,70,3,'#ecdfb2');}else{rect(-22,-87,44,7,'#b68042');}c.strokeStyle=f.isChris?'#a36b4e':'#85563f';c.lineWidth=12;c.beginPath();c.moveTo(-23,-110);c.lineTo(-33,-70);c.moveTo(23,-110);c.lineTo(attacking?65:32,attacking?-100:-72);c.stroke();c.fillStyle=f.isChris?'#b87d56':'#9c6548';c.beginPath();c.ellipse(0,-151,big?29:25,big?34:29,0,0,Math.PI*2);c.fill();c.fillStyle='#211c24';c.beginPath();c.ellipse(0,-174,big?30:26,11,0,Math.PI,Math.PI*2);c.fill();rect(7,-154,5,4,'#17161d');rect(-10,-154,5,4,'#17161d');c.strokeStyle='#492e2b';c.lineWidth=2;c.beginPath();c.arc(1,-142,8,0,Math.PI);c.stroke();if(!big){round(-32,-116,15,59,5,'#456eac');}if(special){round(44,-118,39,37,7,'#3b6696');round(49,-110,29,7,3,'#e0b44e');}if(!f.isChris&&now<f.specialUntil){c.strokeStyle='#ffe17d';c.lineWidth=3;c.beginPath();c.arc(0,-100,67,0,Math.PI*2);c.stroke();}c.restore();}
function draw(now){c.save();if(shake>0)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);background();if(p&&e){drawFighter(p,now);drawFighter(e,now);}for(const a of particles){c.globalAlpha=Math.max(0,a.life/.35);c.fillStyle='#fff1a1';c.beginPath();c.arc(a.x,a.y,5,0,7);c.fill();}c.globalAlpha=1;c.restore();if(playing&&p&&e&&p.attack==='special'&&now<p.attackUntil){c.font='bold 24px system-ui';c.textAlign='center';c.fillStyle='#fff4b1';c.fillText('COMBO DA MOCHILA!',p.x,Math.max(95,p.y-230));}}
function loop(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(hitStop>0)hitStop=Math.max(0,hitStop-dt);else update(dt,now);shake=Math.max(0,shake-35*dt);draw(now);requestAnimationFrame(loop);}p=fighter(235,true);e=fighter(725,false);requestAnimationFrame(loop);
</script></body></html>
